{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'base.css' %}">
   <link rel="stylesheet" href="{% static 'tipografia.css' %}">
    <title>MELI- DESORDENAR PALABRA</title>
</head>
<body>
    <div style="display: flex; gap: 20px; font-family: Cinzel; text-align: center; justify-content: center;">
    <div style="background-color: #5557d4; padding: 20px; border: none; border-radius: 8px;">
        <a style="color: white; font-family: Cinzel;" href="{% url 'automatico' %}"> VOLVER AL INICIO</a>


    </div>
</div>
<div class="contenedor-padre">
        <form action="" method="POST" class="formulario">
            {% csrf_token %}

          <label for="PALABRA" style="font-family: Cinzel; font-size: 16pt; width: 500px; height: 150px;">  INGRESAR PALABRA: </label>
        		<input type="password" id="nombre" name="palabra" pattern="[a-záéíóúñ]+" title="Seis letras máximo y en minúsculas" minlength="2" maxlength="6" required>
                   <br>
                   <br>


                <input  style="font-family: Cinzel; font-size: 16pt; " class="mi-boton-submit" type="submit" value="MOSTRAR" >

        </form>



  <svg viewBox="0 0 2500 2500" width="600" height="600">
    <!-- Círculo adaptado para soportar el grosor de 196pt -->
    <path id="curva196pt" d="M 750,1250 A 500,500 0 1,1 1750,1250" fill="none" />

    <!-- Se aumenta el letter-spacing a 25 para compensar la inclinación -->
    <text class="texto-rotativo" font-size="196pt" font-family="Cinzel, sans-serif" font-weight="bold" fill="rgb(0, 0, 0)" letter-spacing="50">
        <textPath href="#curva196pt" startOffset="50%" text-anchor="middle">
            {{palabra_desordenada}}
        </textPath>
    </text>
</svg>
</div>
</body>
</html>
