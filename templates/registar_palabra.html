{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'base.css' %}">
    <title>MELI- CREAR REGISTRO</title>
</head>
<body>
    <div style="display: flex; gap: 20px; font-family: Cinzel; text-align: center; justify-content: center;">
    <div style="background-color: #5557d4; padding: 20px; border: none; border-radius: 8px;">
    <a style="color: white; font-family: Cinzel;" href="{% url 'automatico' %}"> VOLVER AL INICIO</a>
    </div>
     </div>
    <br>
<br>
<br>
<br>
<div class="contenedor-padre">
{% if user.username == 'meli' %}
<form action="" method="POST" class="formulario">
            {% csrf_token %}

          <label for="PALABRA" style="font-family: Cinzel; font-size: 16pt; width: 500px; height: 150px;">  INGRESAR PALABRA: </label>
        		<input type="text" id="nombre" name="palabra" pattern="[a-záéíóúñ]+" title="Seis letras máximo y en minúsculas" minlength="2" maxlength="6" required>
                   <br>
                   <br>


                <input  style="font-family: Cinzel; font-size: 16pt; " class="mi-boton-submit" type="submit" value="GUARDAR" >

        </form>
        <h1>{{form}}</h1>
        {% else %}
        <h1>No tiene premitido ingresar palabras a la base de datos</h1>
{% endif %}
</div>
</body>
</html>
